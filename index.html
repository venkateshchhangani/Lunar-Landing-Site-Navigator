<meta charset="utf-8">
<title>Lunar Site Navigator</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{height:100%;margin:0;background:#07080b;color:#e8eaee;font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
#ld{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#bar{width:min(420px,80vw);height:8px;background:#232936;border-radius:4px;overflow:hidden}
#fill{height:100%;width:0;background:#ffb454;transition:width .15s}
small{color:#98a0b0;max-width:520px}a{color:#6cb4ff}</style>
<div id="ld"><b style="font-size:22px">Lunar Landing Site Navigator</b>
<div>Loading the tool (about 24 MB, one time). <span id="pc">0%</span></div>
<div id="bar"><div id="fill"></div></div>
<small id="msg">NASA Space Apps Challenge. Team HERMES POLARIS. Built from NASA LOLA data.</small></div>
<script>
(async function(){
var N=9,parts=new Array(N),got=new Array(N).fill(0),total=24556407;
function prog(){var s=0;for(var i=0;i<N;i++)s+=got[i];var p=Math.min(99,Math.round(100*s/total));document.getElementById('pc').textContent=p+'%';document.getElementById('fill').style.width=p+'%'}
function fail(e){document.getElementById('msg').innerHTML='Could not load online ('+(e&&e.message||e)+'). Please download <a href="offline.html">offline.html</a> from the repository and open it in your browser; it works offline.'}
try{
 if(typeof DecompressionStream==='undefined')throw new Error('this browser is too old');
 async function get(i){
   for(var t=0;t<3;t++){
     try{var r=await fetch('data/p'+i+'.bin',{cache:'force-cache'});if(!r.ok)throw new Error('HTTP '+r.status);
       var rd=r.body.getReader(),ch=[],n=0;
       for(;;){var x=await rd.read();if(x.done)break;ch.push(x.value);n+=x.value.length;got[i]=n;prog()}
       var b=new Uint8Array(n),o=0;for(var c of ch){b.set(c,o);o+=c.length}return b
     }catch(e){if(t==2)throw e}
   }
 }
 var res=await Promise.all(Array.from({length:N},function(_,i){return get(i)}));
 var all=new Blob(res);
 var txt=await new Response(all.stream().pipeThrough(new DecompressionStream('gzip'))).text();
 document.open();document.write(txt);document.close();
}catch(e){fail(e)}
})();
</script>
